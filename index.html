<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        /* Ajustes de contenedor para evitar desbordamientos en móviles */
        #contenedor-camara {
            position: relative;
            border: 3px solid #0d6efd;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
        }

        /* Forzar a que la cámara y el área de lectura quepan exactos dentro del marco */
        #reader video, #reader canvas {
            width: 100% !important;
            height: auto !important;
            max-height: 260px;
            object-fit: cover;
        }

        /* Ocultar elementos sobrantes generados por la librería */
        #reader__scan_region img {
            display: none !important;
        }

        /* Línea láser de escaneo ajustada */
        .linea-escaneo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #ff0000;
            box-shadow: 0 0 8px #ff0000;
            animation: escanear 2s infinite ease-in-out;
            z-index: 10;
            pointer-events: none;
        }

        @keyframes escanear {
            0% { top: 10%; }
            50% { top: 85%; }
            100% { top: 10%; }
        }
    </style>
</head>
<body class="container py-3">

    <h3 class="mb-3 text-center">📦 Inventario</h3>

    <!-- PANEL PC -->
    <div id="panel-pc" class="card p-3 mb-3 shadow-sm" style="display: none;">
        <h5>Modo PC</h5>
        <div class="mb-2">
            <label class="form-label">Código:</label>
            <input type="text" id="codigoInput" class="form-control" placeholder="Escanea..." autofocus>
        </div>
        <div class="mb-2">
            <label class="form-label">Nombre:</label>
            <input type="text" id="nombreInput" class="form-control" placeholder="Nombre del producto">
        </div>
        <div class="mb-2">
            <label class="form-label">Cantidad:</label>
            <input type="number" id="cantidadInput" class="form-control" value="1">
        </div>
        <button class="btn btn-primary w-100 mt-2" id="btnGuardar">Guardar</button>
    </div>

    <!-- PANEL MÓVIL -->
    <div id="panel-movil" class="card p-3 mb-3 shadow-sm text-center" style="display: none;">
        <h5>📱 Escáner Celular</h5>
        
        <button id="btnActivarCamara" class="btn btn-success btn-lg w-100 my-2">📷 Activar Cámara</button>

        <!-- CONTENEDOR VISUAL DE LA CÁMARA -->
        <div id="wrapper-camara" style="display: none;" class="my-2">
            <div id="estado-camara" class="badge bg-danger mb-2 p-2 w-100 fs-6">🔴 CÁMARA ACTIVA</div>
            
            <div id="contenedor-camara">
                <div class="linea-escaneo"></div>
                <div id="reader"></div>
            </div>

            <button class="btn btn-outline-danger w-100 mt-3" id="btnCerrarCamara">Cerrar Cámara</button>
        </div>
        
        <!-- FORMULARIO TRAS ESCANEAR -->
        <div id="form-movil" class="mt-3 text-start" style="display: none;">
            <div class="mb-2">
                <label class="form-label">Código Detectado:</label>
                <input type="text" id="codigoMovil" class="form-control fw-bold text-success" readonly>
            </div>
            <div class="mb-2">
                <label class="form-label">Nombre del Producto:</label>
                <input type="text" id="nombreMovil" class="form-control" placeholder="Ej. Pantalón Azul">
            </div>
            <div class="mb-2">
                <label class="form-label">Cantidad:</label>
                <input type="number" id="cantidadMovil" class="form-control" value="1">
            </div>
            <button class="btn btn-primary w-100 mt-2" id="btnGuardarMovil">Guardar en Inventario</button>
            <button class="btn btn-secondary w-100 mt-2" id="btnEscanearOtro">Escanear Otro</button>
        </div>
    </div>

    <!-- TABLA DE STOCK -->
    <div class="card p-3 shadow-sm">
        <h5>Stock Actual</h5>
        <div class="table-responsive">
            <table class="table table-striped table-sm mt-2">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Producto</th>
                        <th>Cant.</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla">
                    <!-- Dinámico -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
