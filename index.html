<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="container py-4">

    <h2 class="mb-4 text-center">📦 Sistema de Inventario</h2>

    <!-- SECCIÓN PARA COMPUTADORAS (Pistola USB o Barcode to PC) -->
    <div id="panel-pc" class="card p-4 mb-4 shadow-sm" style="display: none;">
        <h4>Registrar Producto (Modo PC)</h4>
        <div class="row g-3 mt-2">
            <div class="col-md-4">
                <label for="codigoInput" class="form-label">Código de Barras:</label>
                <input type="text" id="codigoInput" class="form-control" placeholder="Escanea o escribe..." autofocus>
            </div>
            <div class="col-md-4">
                <label for="nombreInput" class="form-label">Nombre del Producto:</label>
                <input type="text" id="nombreInput" class="form-control" placeholder="Ej. Camisa Roja">
            </div>
            <div class="col-md-2">
                <label for="cantidadInput" class="form-label">Cantidad:</label>
                <input type="number" id="cantidadInput" class="form-control" value="1">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-primary w-100" id="btnGuardar">Guardar</button>
            </div>
        </div>
    </div>

    <!-- SECCIÓN PARA TELÉFONOS MÓVILES (Con botón exclusivo) -->
    <div id="panel-movil" class="card p-4 mb-4 shadow-sm text-center" style="display: none;">
        <h4>📱 Escáner Móvil</h4>
        <p class="text-muted">Presiona el botón para abrir la cámara y escanear</p>
        
        <!-- Botón exclusivo para abrir la cámara en el teléfono -->
        <button id="btnActivarCamara" class="btn btn-primary btn-lg w-100 mb-3">📷 Activar Cámara para Escanear</button>

        <!-- Contenedor donde aparecerá la cámara al presionar el botón -->
        <div id="reader" style="width: 100%; max-width: 400px; margin: 0 auto; display: none;"></div>
        
        <!-- Formulario que aparece automáticamente al detectar un código -->
        <div id="form-movil" class="mt-3" style="display: none;">
            <div class="mb-3 text-start">
                <label class="form-label">Código Detectado:</label>
                <input type="text" id="codigoMovil" class="form-control" readonly>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label">Nombre del Producto:</label>
                <input type="text" id="nombreMovil" class="form-control" placeholder="Nombre del producto">
            </div>
            <div class="mb-3 text-start">
                <label class="form-label">Cantidad:</label>
                <input type="number" id="cantidadMovil" class="form-control" value="1">
            </div>
            <button class="btn btn-success w-100 btn-lg" id="btnGuardarMovil">Guardar en Inventario</button>
            <button class="btn btn-secondary w-100 mt-2" id="btnCancelarEscaneo">Cancelar / Escanear Otro</button>
        </div>
    </div>

    <!-- Tabla de Inventario -->
    <div class="card p-4 shadow-sm">
        <h4>Stock Actual</h4>
        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla">
                <!-- Se llena dinámicamente -->
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
